name: Public source verification

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-source-${{ github.ref }}
  cancel-in-progress: true

# The deployment pipeline is manually disabled. Source checks need their own
# active, credential-free lane; runtime activation remains separately governed.
jobs:
  source:
    name: Source checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci
      - run: npm run validate:package-lock
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:unit
      - run: npm run test:publication
      - run: npm run validate:html

  browsers:
    name: Browser and accessibility tests (${{ matrix.project }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            browser: chromium
          - project: firefox
            browser: firefox
          - project: Mobile Chrome
            browser: chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci
      - run: npx --no-install playwright install --with-deps "${{ matrix.browser }}"
      - run: npm test -- --project="${{ matrix.project }}"
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-source-browser-report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  packaging:
    name: Public exhibit packaging
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: '24.19.0'
      - run: npm run test:publication
      - run: npm run build:exhibits
      - run: npm run stage:public
      - run: node scripts/verify-public-artifact.mjs
