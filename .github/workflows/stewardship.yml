name: Stewardship Protocol

on:
  push:
    branches: [main, lane/verify-heal, lane/editions]
  pull_request:
    branches: [main, lane/verify-heal, lane/editions]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol-tests:
    name: Stewardship Protocol Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: '22'
      - name: Test intention-preserving automation
        run: node --test tests/governance/*.test.cjs
