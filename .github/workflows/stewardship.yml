name: Stewardship Protocol

on:
  push:
    branches: [main, lane/verify-heal, lane/editions]
  pull_request:
    branches: [main, lane/verify-heal, lane/editions]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol-tests:
    name: Stewardship Protocol Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Test intention-preserving automation
        run: node --test tests/governance/*.test.cjs
