# Restores the required status check context "validate-dependencies"
# (branch protection). CI/CD Pipeline is disabled_manually; this focused
# workflow reports the missing required check on PRs/pushes to main.
name: validate-dependencies

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  validate-dependencies:
    name: validate-dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate package-lock.json
        run: npm run validate:package-lock
