name: Project Board Automation

on:
  issues:
    types: [assigned, unassigned]
  pull_request_target:
    types:
      [
        opened,
        reopened,
        edited,
        synchronize,
        ready_for_review,
        converted_to_draft,
        closed,
      ]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  update-assignment:
    name: Update Issue Assignment Labels
    runs-on: ubuntu-latest
    if: github.event_name == 'issues'
    steps:
      - name: Update in-progress label
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7
        with:
          script: |
            const issue = context.payload.issue;
            if (context.payload.action === 'assigned') {
              await github.rest.issues.addLabels({
                ...context.repo, issue_number: issue.number, labels: ['in-progress']
              });
            } else if (issue.assignees.length === 0) {
              try {
                await github.rest.issues.removeLabel({
                  ...context.repo, issue_number: issue.number, name: 'in-progress'
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

  verify-issue-linkage:
    name: Preserve Issue Intentions
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request_target' && github.event.action != 'closed'
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Write-token jobs never check out or execute PR-head code.
      - name: Check out trusted default-branch policy
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Reject merge-triggered issue closure
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7
        with:
          script: |
            const { validatePullRequestLinkage } = require('./scripts/stewardship.cjs');
            const findings = await validatePullRequestLinkage({ github, context });
            if (findings.length) {
              core.setFailed(
                'Native closing directives bypass verification on default. Use Refs #N; ' +
                'record a closure verdict after the finish line is verified on default. ' +
                JSON.stringify(findings)
              );
            }

  record-merged-intentions:
    name: Record Pending Default-Branch Verification
    runs-on: ubuntu-latest
    concurrency:
      group: stewardship-receipt-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true
    steps:
      - name: Check out trusted default-branch policy
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Record successor without changing issue state
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7
        with:
          script: |
            const { recordMergedIntentions } = require('./scripts/stewardship.cjs');
            const recorded = await recordMergedIntentions({ github, context });
            core.info(`Pending-verification receipts recorded for ${recorded.length} issues.`);

  label-pr:
    name: Update Pull Request Labels
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request_target'
    steps:
      - name: Check out trusted default-branch policy
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Label metadata and changed paths
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7
        with:
          script: |
            const { labelsForPullRequest } = require('./scripts/stewardship.cjs');
            const pr = context.payload.pull_request;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo, pull_number: pr.number, per_page: 100
            });
            const { add: labels, remove: obsolete } = labelsForPullRequest(
              pr, files.map(file => file.filename)
            );
            for (const name of obsolete) {
              try {
                await github.rest.issues.removeLabel({
                  ...context.repo, issue_number: pr.number, name
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
            if (labels.length) {
              await github.rest.issues.addLabels({
                ...context.repo, issue_number: pr.number, labels
              });
            }
